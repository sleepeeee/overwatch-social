                    - text: 複製代碼
                - generic [ref=e140]: "#!/bin/bash # ---------------------------------------------------------------------- # 據點裁判 NPC 自動結算機關 - Git post-receive Hook # ---------------------------------------------------------------------- RAW_LOGS=$(git log --since=\"midnight\" --numstat --pretty=format:\"AUTHOR:%an\") python3 - <<EOF import re import json from datetime import datetime raw_data = \"\"\"${RAW_LOGS}\"\"\" lines = raw_data.strip().split('\\n') players = { \"left\": {\"side\": \"left\", \"label\": \"你方\", \"commits\": 0, \"additions\": 0, \"deletions\": 0}, \"right\": {\"side\": \"right\", \"label\": \"朋友\", \"commits\": 0, \"additions\": 0, \"deletions\": 0} } # ⚠️ 請填入您和朋友的 Git 使用者名稱 left_authors = [\"YourGitName\", \"你方帳號名\"] right_authors = [\"FriendGitName\", \"朋友帳號名\"] current_author = None for line in lines: if not line: continue if line.startswith(\"AUTHOR:\"): author = line.replace(\"AUTHOR:\", \"\").strip() if author in left_authors: current_author = \"left\" elif author in right_authors: current_author = \"right\" else: current_author = None if current_author: players[current_author][\"commits\"] += 1 else: match = re.match(r'^(\\d+)\\s+(\\d+)\\s+.*', line) if match and current_author: players[current_author][\"additions\"] += int(match.group(1)) players[current_author][\"deletions\"] += int(match.group(2)) for key in [\"left\", \"right\"]: p = players[key] score = (p[\"commits\"] * 10) + (p[\"additions\"] * 0.1) - (p[\"deletions\"] * 0.05) p[\"score\"] = max(0, round(score)) total = players[\"left\"][\"score\"] + players[\"right\"][\"score\"] if total > 0: players[\"left\"][\"percent\"] = round((players[\"left\"][\"score\"] / total) * 100) players[\"right\"][\"percent\"] = 100 - players[\"left\"][\"percent\"] else: players[\"left\"][\"percent\"] = players[\"right\"][\"percent\"] = 50 msg = (\"你方戰線暫時壓制！\" if players[\"left\"][\"percent\"] > 50 else \"防線告急，敵方正重兵壓制！\" if players[\"left\"][\"percent\"] < 50 else \"據點爭奪異常激烈，戰線持平！\") report = { \"date\": datetime.now().strftime(\"%Y-%m-%d\"), \"timezone\": \"Asia/Taipei\", \"updatedAt\": datetime.now().isoformat() + \"+08:00\", \"status\": \"ready\", \"message\": msg, \"players\": [players[\"left\"], players[\"right\"]] } output_path = \"/var/www/html/data/outpost.json\" try: with open(output_path, \"w\", encoding=\"utf-8\") as f: json.dump(report, f, ensure_ascii=False, indent=2) print(\"🏆 [據點裁判]：戰績結算完成！已輸出至 \" + output_path) except Exception as e: print(\"❌ [據點裁判]：寫入失敗：\" + str(e)) EOF"
